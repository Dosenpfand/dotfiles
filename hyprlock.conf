# hyprlock: fingerprint and password are checked in parallel.
# Fingerprint goes through fprintd directly (not PAM); /etc/pam.d/hyprlock
# handles the password only.

general {
    hide_cursor = true
}

auth {
    pam:enabled = true
    fingerprint:enabled = true
    fingerprint:ready_message = touch or type
    fingerprint:present_message = scanning
}

background {
    monitor =
    color = rgb(000000)
}

input-field {
    monitor =
    size = 320, 50
    position = 0, 0
    halign = center
    valign = center
    placeholder_text = Password
    fail_text = $PAMFAIL
}

label {
    monitor =
    text = $FPRINTPROMPT
    font_size = 14
    position = 0, -60
    halign = center
    valign = center
}
